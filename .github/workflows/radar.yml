name: Radar semanal
on:
  schedule:
    - cron: "0 8 * * 1"      # informe semanal (lunes 8:00 UTC)
    - cron: "*/10 * * * *"   # mira si le has escrito un nicho al bot en Telegram
  workflow_dispatch:
    inputs:
      nicho:
        description: "Nicho o producto (vacío = nichos por defecto)"
        required: false
        default: ""
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  enviar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python productos.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENTO: ${{ github.event.schedule }}
          NICHO: ${{ github.event.inputs.nicho }}

name: Radar semanal
on:
  schedule:
    - cron: "0 8 * * 1"   # lunes 8:00 UTC (9:00/10:00 en España)
  workflow_dispatch:
    inputs:
      palabra:
        description: "Opcional: solo productos que contengan esta palabra (ej. cocina)"
        required: false
        default: ""
jobs:
  enviar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python productos.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          FILTRO: ${{ github.event.inputs.palabra }}
